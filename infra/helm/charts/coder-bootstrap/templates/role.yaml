apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "coder-bootstrap.fullname" . }}
  labels:
    {{- include "coder-bootstrap.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - create
      - patch
      - update
