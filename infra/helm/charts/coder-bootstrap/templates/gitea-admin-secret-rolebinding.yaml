{{- if .Values.gitea.url }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "coder-bootstrap.fullname" . }}-gitea-admin-reader
  namespace: {{ .Values.gitea.adminSecret.namespace | quote }}
  labels:
    {{- include "coder-bootstrap.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "coder-bootstrap.serviceAccountName" . }}
    namespace: {{ .Release.Namespace | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "coder-bootstrap.fullname" . }}-gitea-admin-reader
{{- end }}
