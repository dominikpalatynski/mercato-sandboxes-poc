{{- if .Values.gitea.url }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "coder-bootstrap.fullname" . }}-gitea-admin-reader
  namespace: {{ .Values.gitea.adminSecret.namespace | quote }}
  labels:
    {{- include "coder-bootstrap.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - {{ .Values.gitea.adminSecret.name | quote }}
    verbs:
      - get
{{- end }}
