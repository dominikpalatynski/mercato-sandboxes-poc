# Build and push the app image with:
# IMAGE_TAG=git-$(git rev-parse --short HEAD)
# docker buildx build \
#   --platform linux/amd64 \
#   -f apps/crm/Dockerfile \
#   -t ghcr.io/dominikpalatynski/crm:${IMAGE_TAG} \
#   apps/crm \
#   --push
image:
  repository: ghcr.io/dominikpalatynski/crm
  tag: v1.8.0

imagePullSecrets:
  - name: ghcr-pull

app:
  command:
    - /bin/sh
    - -lc
    - |
      set -e
      MERCATO="node /app/node_modules/@open-mercato/cli/bin/mercato"
      INIT_MARKER_FILE="/app/storage/.initialized" \
      INIT_COMMAND="$MERCATO init" \
      MIGRATE_COMMAND="$MERCATO db migrate" \
      sh /app/docker/scripts/init-or-migrate.sh
      exec $MERCATO server start
  env:
    APP_URL: "https://crm.sandbox.<yourdomain>.com"
    NEXT_PUBLIC_APP_URL: "https://crm.sandbox.<yourdomain>.com"
    APP_ALLOWED_ORIGINS: "https://crm.sandbox.<yourdomain>.com"
    SELF_SERVICE_ONBOARDING_ENABLED: "true"
    DEMO_MODE: "false"
    UPGRADE_ACTIONS_ENABLED: "false"
    NEXT_PUBLIC_UPGRADE_ACTIONS_ENABLED: "false"
    TENANT_DATA_ENCRYPTION: "yes"
    ENABLE_CRUD_API_CACHE: "true"
    CACHE_STRATEGY: redis
    QUEUE_STRATEGY: async
    NEXT_PUBLIC_QUEUE_STRATEGY: async
    AUTO_SPAWN_WORKERS: "true"
    AUTO_SPAWN_SCHEDULER: "true"
    OM_DISABLE_VECTOR_SEARCH_AUTOINDEXING: "true"
    OM_AI_PROVIDER: openai
    OM_AI_MODEL: gpt-5-mini
    ONBOARDING_WEBHOOK_URL: "http://onboarding.mercato-sandboxes.svc.cluster.local/api/billing/om/webhook"
    ONBOARDING_WEBHOOK_PRODUCT_CODE: "basic-sandbox"
    SANDBOX_BILLING_WEBHOOK_URL: "http://onboarding.mercato-sandboxes.svc.cluster.local/api/billing/openmercato/webhook"
    SANDBOX_BILLING_WEBHOOK_TIMEOUT_MS: "15000"
    OM_SANDBOX_BILLING_ENABLE_MOCK_GATEWAYS: "true"
    OM_SANDBOX_BILLING_AUTO_SEED: "true"
    OM_SANDBOX_BILLING_AUTO_SEED_PROVIDER: "mock"
    OM_SUBSCRIPTIONS_PLANS_FILE: "/app/src/plans.ts"
  secretName: openmercato-app-secrets
  secretEnv:
    - name: DATABASE_URL
      secretKey: DATABASE_URL
    - name: REDIS_URL
      secretKey: REDIS_URL
    - name: QUEUE_REDIS_URL
      secretKey: QUEUE_REDIS_URL
    - name: CACHE_REDIS_URL
      secretKey: CACHE_REDIS_URL
    - name: JWT_SECRET
      secretKey: JWT_SECRET
    - name: AUTH_SECRET
      secretKey: AUTH_SECRET
    - name: TENANT_DATA_ENCRYPTION_FALLBACK_KEY
      secretKey: TENANT_DATA_ENCRYPTION_FALLBACK_KEY
    - name: OM_INIT_SUPERADMIN_EMAIL
      secretKey: OM_INIT_SUPERADMIN_EMAIL
    - name: OM_INIT_SUPERADMIN_PASSWORD
      secretKey: OM_INIT_SUPERADMIN_PASSWORD
    - name: SANDBOX_BILLING_WEBHOOK_SECRET
      secretKey: SANDBOX_BILLING_WEBHOOK_SECRET
    - name: ONBOARDING_WEBHOOK_SECRET
      secretKey: SANDBOX_BILLING_WEBHOOK_SECRET
    - name: SANDBOX_BILLING_CONTEXT_SECRET
      secretKey: SANDBOX_BILLING_CONTEXT_SECRET
    - name: MOCK_GATEWAY_WEBHOOK_SECRET
      secretKey: MOCK_GATEWAY_WEBHOOK_SECRET

postgres:
  auth:
    database: openmercato
    username: openmercato
    password: REPLACE_ME_OPENMERCATO_DB_PASSWORD

nodeSelector:
  node-pool: system

tolerations:
  - key: dedicated
    operator: Equal
    value: system
    effect: NoSchedule
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: traefik
    cert-manager.io/cluster-issuer: letsencrypt-http
  hosts:
    - host: crm.sandbox.<yourdomain>.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - crm.sandbox.<yourdomain>.com
      secretName: crm-sandbox-palatynskicloud-tls
