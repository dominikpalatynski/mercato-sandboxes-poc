# Build and push the app image with:
# bash scripts/build-and-push-onboarding-image.sh
image:
  repository: ghcr.io/dominikpalatynski/mercato-onboarding
  tag: git-fba59d7v11
imagePullSecrets:
  - name: ghcr-pull

env:
  - name: COOKIE_SECURE
    value: "true"
  - name: COOKIE_DOMAIN
    value: ".sandbox.<yourdomain>.com"
  - name: BILLING_BACKEND
    value: "openmercato"
  - name: ONBOARDING_PUBLIC_URL
    value: "https://sandbox.<yourdomain>.com"
  - name: CODER_URL
    value: "http://coder.mercato-sandboxes.svc.cluster.local"
  - name: CODER_PUBLIC_URL
    value: "https://coder.sandbox.<yourdomain>.com"
  - name: WILDCARD_APPS_DOMAIN
    value: "apps.sandbox.<yourdomain>.com"
  - name: GITEA_API_URL
    value: "http://gitea-http.gitea.svc.cluster.local:3000"
  - name: GITEA_PUBLIC_URL
    value: "https://gitea.sandbox.<yourdomain>.com"
  - name: WORKSPACE_NAMESPACE
    value: "mercato-sandboxes"
  # Trust the in-cluster CA so global fetch can talk to the Kubernetes API
  # server when creating/updating workspace-credentials Secrets.
  - name: NODE_EXTRA_CA_CERTS
    value: "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
  - name: OPENMERCATO_API_BASE_URL
    value: "https://crm.sandbox.<yourdomain>.com"
  - name: OPENMERCATO_BILLING_WEBHOOK_TOLERANCE_SECONDS
    value: "300"
  - name: PAYBYLINK_SIGNATURE_ALGORITHM
    value: "sha256"
  - name: BILLING_USD_TO_PLN_RATE
    value: "4.0"
  - name: BILLING_ACTIVATION_FEE_PLN
    value: "0"

secretEnv:
  - name: POSTGRES_URL
    secretName: onboarding-app-secrets
    secretKey: POSTGRES_URL
  - name: GITHUB_APP_ID
    secretName: github-app-credentials
    secretKey: app-id
  - name: GITHUB_APP_SLUG
    secretName: github-app-credentials
    secretKey: app-slug
  - name: GITHUB_APP_WEBHOOK_SECRET
    secretName: github-app-credentials
    secretKey: webhook-secret
  - name: JWT_SECRET
    secretName: onboarding-app-secrets
    secretKey: JWT_SECRET
  - name: PAYBYLINK_SHOP_ID
    secretName: onboarding-app-secrets
    secretKey: PAYBYLINK_SHOP_ID
  - name: PAYBYLINK_PRIVATE_KEY
    secretName: onboarding-app-secrets
    secretKey: PAYBYLINK_PRIVATE_KEY
  - name: OPENROUTER_MANAGEMENT_KEY
    secretName: onboarding-app-secrets
    secretKey: OPENROUTER_MANAGEMENT_KEY
  - name: BILLING_SYNC_SECRET
    secretName: onboarding-app-secrets
    secretKey: BILLING_SYNC_SECRET
  - name: OPENMERCATO_API_KEY
    secretName: onboarding-app-secrets
    secretKey: OPENMERCATO_API_KEY
  - name: OPENMERCATO_CUSTOMER_TENANT_ID
    secretName: onboarding-app-secrets
    secretKey: OPENMERCATO_CUSTOMER_TENANT_ID
  - name: OPENMERCATO_CUSTOMER_ORGANIZATION_ID
    secretName: onboarding-app-secrets
    secretKey: OPENMERCATO_CUSTOMER_ORGANIZATION_ID
  - name: OPENMERCATO_BILLING_WEBHOOK_SECRET
    secretName: onboarding-app-secrets
    secretKey: OPENMERCATO_BILLING_WEBHOOK_SECRET
  - name: OM_BILLING_WEBHOOK_SECRET
    secretName: onboarding-app-secrets
    secretKey: OPENMERCATO_BILLING_WEBHOOK_SECRET

fileSecrets:
  - name: coder-admin-token
    envName: CODER_ADMIN_TOKEN_FILE
    secretName: onboarding-coder-admin
    secretKey: token
    mountPath: /run/secrets/coder-admin
    fileName: token
  - name: coder-template-id
    envName: CODER_TEMPLATE_ID_FILE
    secretName: onboarding-coder-template
    secretKey: template-id
    mountPath: /run/secrets/coder-template
    fileName: template-id
  - name: gitea-admin-token
    envName: GITEA_ADMIN_TOKEN_FILE
    secretName: gitea-onboarding-admin-token
    secretKey: token
    mountPath: /run/secrets/gitea-admin
    fileName: token
  - name: github-app-private-key
    envName: GITHUB_APP_PRIVATE_KEY_FILE
    secretName: github-app-private-key
    secretKey: private-key.pem
    mountPath: /run/secrets/github-app
    fileName: private-key.pem

databaseMigration:
  enabled: true

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

nodeSelector:
  node-pool: system

tolerations:
  - key: dedicated
    operator: Equal
    value: system
    effect: NoSchedule
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-http
  hosts:
    - host: sandbox.<yourdomain>.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - sandbox.<yourdomain>.com
      secretName: sandbox-palatynskicloud-tls
