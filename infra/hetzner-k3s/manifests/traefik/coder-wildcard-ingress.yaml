apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: coder-edge
  namespace: mercato-sandboxes
  labels:
    app.kubernetes.io/part-of: mercato-sandboxes
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - coder.sandbox.<yourdomain>.com
        - "*.apps.sandbox.<yourdomain>.com"
      secretName: sandbox-palatynskicloud-wildcard-tls
  rules:
    - host: coder.sandbox.<yourdomain>.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: coder
                port:
                  number: 80
    - host: "*.apps.sandbox.<yourdomain>.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: coder
                port:
                  number: 80
