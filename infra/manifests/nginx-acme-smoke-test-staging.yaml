# Replace the host below with a real DNS name that resolves to the cluster
# load balancer before applying this manifest.
apiVersion: v1
kind: Namespace
metadata:
  name: acme-smoke-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: acme-smoke-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: acme-smoke-test
spec:
  selector:
    app: nginx
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx
  namespace: acme-smoke-test
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-http-staging
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - nginx-test.sandbox.example.com
      secretName: nginx-test-tls
  rules:
    - host: nginx-test.sandbox.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  number: 80
