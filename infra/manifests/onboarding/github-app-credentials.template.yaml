# Non-key GitHub App credentials. The private-key PEM lives in a separate
# Secret `github-app-private-key` mounted as a file. See infra/GITHUB-APP.md
# for the end-to-end setup.
apiVersion: v1
kind: Secret
metadata:
  name: github-app-credentials
  namespace: mercato-sandboxes
  labels:
    app.kubernetes.io/part-of: mercato-sandboxes
type: Opaque
stringData:
  app-id: "REPLACE_ME_APP_ID"
  app-slug: "mercato-agent"
  webhook-secret: REPLACE_ME_GITHUB_WEBHOOK_SECRET
