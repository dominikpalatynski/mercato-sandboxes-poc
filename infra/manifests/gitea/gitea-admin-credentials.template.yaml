# Consumed by the Gitea Helm chart via gitea.admin.existingSecret in
# infra/helm/values/gitea.yaml. The chart ensures the admin user exists on
# every restart, but it does NOT rotate the password if it already exists.
apiVersion: v1
kind: Secret
metadata:
  name: gitea-admin-credentials
  namespace: gitea
  labels:
    app.kubernetes.io/part-of: mercato-sandboxes
type: Opaque
stringData:
  username: mercato-admin
  password: REPLACE_ME_GITEA_ADMIN_PASSWORD
  email: gitea-admin@palatynskicloud.com
