# Mercato Sandboxes POC - control plane services
#
# Brings up:
#   - postgres-coder       : Coder's metadata DB (postgres:17)
#   - postgres-onboarding  : Onboarding app DB (postgres:17-alpine, host port 5544)
#   - coder                : Coder control plane (ghcr.io/coder/coder:latest)
#   - onboarding           : Next.js UI for sign-up + sandbox provisioning
#   - edge                 : single edge proxy for the whole stack
#
# Routing model — a small nginx edge proxy publishes:
#   https://coder.sandbox.lvh.me           → coder:80
#   https://*.apps.sandbox.lvh.me          → Coder wildcard app proxy
#   https://sandbox.lvh.me, app.sandbox…   → onboarding:3000
# Port 80 only redirects to HTTPS. Docker Desktop's published port-80 path
# was observed to close Coder PTY/code-server websocket streams after 101;
# the standard HTTPS :443 path stays stable and matches Coder's documented
# production topology.

name: mercato-sandboxes

networks:
  control:
    driver: bridge
  # Shared edge network: the nginx edge proxy, Coder, onboarding, and all
  # workspace containers live here. `name:` is pinned so the Terraform
  # `data "docker_network" "proxy"` lookup finds it regardless of compose's
  # project-name prefix.
  mercato-proxy:
    name: mercato-proxy
    driver: bridge

volumes:
  postgres-coder-data:
  postgres-onboarding-data:
  coder-data:

services:
  postgres-coder:
    image: postgres:17
    container_name: postgres-coder
    restart: unless-stopped
    environment:
      POSTGRES_USER: coder
      POSTGRES_PASSWORD: coder
      POSTGRES_DB: coder
    volumes:
      - postgres-coder-data:/var/lib/postgresql/data
    networks:
      - control
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coder -d coder"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres-onboarding:
    image: postgres:17-alpine
    container_name: postgres-onboarding
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ONBOARDING_DB_USER:-onboarding}
      POSTGRES_PASSWORD: ${ONBOARDING_DB_PASSWORD:-onboarding}
      POSTGRES_DB: ${ONBOARDING_DB_NAME:-onboarding}
    ports:
      - "${ONBOARDING_DB_PORT:-5544}:5432"
    volumes:
      - postgres-onboarding-data:/var/lib/postgresql/data
    networks:
      - control
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ONBOARDING_DB_USER:-onboarding} -d ${ONBOARDING_DB_NAME:-onboarding}"]
      interval: 5s
      timeout: 5s
      retries: 20

  coder:
    image: ghcr.io/coder/coder:latest
    container_name: coder
    restart: unless-stopped
    # macOS docker.sock perms gotcha: run as root so Coder can talk to the host docker daemon
    user: root
    depends_on:
      postgres-coder:
        condition: service_healthy
    environment:
      CODER_PG_CONNECTION_URL: postgres://coder:coder@postgres-coder:5432/coder?sslmode=disable
      # Listen on :80 inside the container. Browser traffic arrives through
      # nginx HTTPS on host :443; fresh workspace agents use the template's
      # internal AGENT_CODER_URL default (`http://coder.<SANDBOX_DOMAIN>`) on
      # the shared Docker network.
      CODER_HTTP_ADDRESS: 0.0.0.0:80
      # Browser-facing origin. Coder validates the WS Origin header against
      # this; mismatch silently 1006s the PTY / metadata-watch / path-app
      # streams.
      CODER_ACCESS_URL: ${CODER_ACCESS_URL:-https://coder.sandbox.lvh.me}
      # Wildcard for subdomain-style coder_app / port-forward proxying. The
      # edge proxy routes *.apps.<domain> back to Coder, and Coder proxies into
      # the workspace. Coder expects the hostname form, not a URL.
      CODER_WILDCARD_ACCESS_URL: ${CODER_WILDCARD_ACCESS_URL:-*.apps.sandbox.lvh.me}
      # First user env vars are referenced by scripts/bootstrap-coder.sh (task #4)
      CODER_FIRST_USER_EMAIL: ${CODER_FIRST_USER_EMAIL:-admin@local.dev}
      CODER_FIRST_USER_USERNAME: ${CODER_FIRST_USER_USERNAME:-admin}
      CODER_FIRST_USER_PASSWORD: ${CODER_FIRST_USER_PASSWORD:-Sup3rSecret!}
      CODER_TELEMETRY_ENABLE: "false"
      # Allow scripts/bootstrap-coder.sh to mint a long-lived (1y) admin API token.
      # Default admin-token cap is 168h (7d); we extend it for the POC onboarding workflow.
      CODER_MAX_TOKEN_LIFETIME: "8760h"
      CODER_MAX_ADMIN_TOKEN_LIFETIME: "8760h"
      # Force the agent relay onto ordinary WebSocket. Some reverse proxies
      # mishandle Coder's default non-standard Upgrade: derp transport, which
      # shows up as terminal/PTTY streams that connect and immediately close.
      CODER_DERP_FORCE_WEBSOCKETS: "true"
      # Allow share=authenticated on path-based coder_apps (code-server / terminal).
      CODER_DANGEROUS_ALLOW_PATH_APP_SHARING: "true"
      CODER_DANGEROUS_ALLOW_PATH_APP_SITE_OWNER_ACCESS: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - coder-data:/home/coder/.config
    networks:
      control:
      mercato-proxy:
        # Workspace agents resolve coder.<DOMAIN> via the mercato-proxy
        # docker network's DNS so they reach Coder directly over the internal
        # bridge. Browsers hit the nginx edge on :443.
        aliases:
          - coder.${SANDBOX_DOMAIN:-sandbox.lvh.me}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30

  onboarding:
    build:
      context: ./apps/onboarding
      args:
        CODER_PUBLIC_URL: ${CODER_PUBLIC_URL:-https://coder.sandbox.lvh.me}
    container_name: onboarding
    restart: unless-stopped
    depends_on:
      postgres-onboarding:
        condition: service_healthy
      coder:
        condition: service_healthy
    environment:
      NODE_ENV: production
      POSTGRES_URL: postgres://${ONBOARDING_DB_USER:-onboarding}:${ONBOARDING_DB_PASSWORD:-onboarding}@postgres-onboarding:5432/${ONBOARDING_DB_NAME:-onboarding}
      JWT_SECRET: ${JWT_SECRET}
      CODER_URL: http://coder
      CODER_PUBLIC_URL: ${CODER_PUBLIC_URL:-https://coder.sandbox.lvh.me}
      CODER_ADMIN_TOKEN_FILE: /run/secrets/coder-admin-token
      CODER_TEMPLATE_ID_FILE: /run/secrets/coder-template-id
      # Cookie scoped to the wildcard root so sessions are coherent across
      # the onboarding host AND every <sandbox>.<SANDBOX_DOMAIN> subdomain.
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-.${SANDBOX_DOMAIN:-sandbox.lvh.me}}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    ports:
      - "${ONBOARDING_HTTP_PORT:-3000}:3000"
    volumes:
      - ./.runtime:/run/secrets:ro
    networks:
      - control
      - mercato-proxy

  edge:
    image: nginx:stable-alpine
    container_name: edge
    restart: unless-stopped
    depends_on:
      - onboarding
      - coder
    command:
      - /bin/sh
      - -lc
      - |
        sed \
          -e "s|\$${SANDBOX_DOMAIN}|$${SANDBOX_DOMAIN}|g" \
          -e "s|\$${WILDCARD_APPS_DOMAIN}|$${WILDCARD_APPS_DOMAIN}|g" \
          -e "s|\$${PROXY_SCHEME}|$${PROXY_SCHEME}|g" \
          /etc/nginx/templates/edge.conf.template \
          > /etc/nginx/nginx.conf
        exec nginx -g 'daemon off;'
    environment:
      SANDBOX_DOMAIN: ${SANDBOX_DOMAIN:-sandbox.lvh.me}
      WILDCARD_APPS_DOMAIN: ${WILDCARD_APPS_DOMAIN:-apps.sandbox.lvh.me}
      PROXY_SCHEME: ${PROXY_SCHEME:-https}
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_HTTPS_PORT:-443}:443"
    volumes:
      - ./proxy/edge.conf.template:/etc/nginx/templates/edge.conf.template:ro
      - ./.runtime/tls:/etc/nginx/tls:ro
    networks:
      - mercato-proxy
