# Mercato Sandboxes POC - control plane services
#
# Brings up:
#   - postgres-coder       : Coder's metadata DB (postgres:17)
#   - postgres-onboarding  : Onboarding app DB (postgres:17-alpine, host port 5544)
#   - coder                : Coder control plane (ghcr.io/coder/coder:latest, host port 7080)
#
# The onboarding Next.js service (apps/onboarding/) builds the user-facing UI on :3000.

name: mercato-sandboxes

networks:
  control:
    driver: bridge
  # Shared proxy network: caddy-docker-proxy lives here; the Coder template
  # also attaches every workspace container to it (see coder/template/main.tf).
  # `name:` is pinned so the Terraform `data "docker_network" "proxy"` lookup
  # finds it regardless of compose's project-name prefix.
  mercato-proxy:
    name: mercato-proxy
    driver: bridge

volumes:
  postgres-coder-data:
  postgres-onboarding-data:
  coder-data:
  caddy-data:
  caddy-config:

services:
  postgres-coder:
    image: postgres:17
    container_name: postgres-coder
    restart: unless-stopped
    environment:
      POSTGRES_USER: coder
      POSTGRES_PASSWORD: coder
      POSTGRES_DB: coder
    volumes:
      - postgres-coder-data:/var/lib/postgresql/data
    networks:
      - control
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coder -d coder"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres-onboarding:
    image: postgres:17-alpine
    container_name: postgres-onboarding
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ONBOARDING_DB_USER:-onboarding}
      POSTGRES_PASSWORD: ${ONBOARDING_DB_PASSWORD:-onboarding}
      POSTGRES_DB: ${ONBOARDING_DB_NAME:-onboarding}
    ports:
      - "${ONBOARDING_DB_PORT:-5544}:5432"
    volumes:
      - postgres-onboarding-data:/var/lib/postgresql/data
    networks:
      - control
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ONBOARDING_DB_USER:-onboarding} -d ${ONBOARDING_DB_NAME:-onboarding}"]
      interval: 5s
      timeout: 5s
      retries: 20

  coder:
    image: ghcr.io/coder/coder:latest
    container_name: coder
    restart: unless-stopped
    # macOS docker.sock perms gotcha: run as root so Coder can talk to the host docker daemon
    user: root
    depends_on:
      postgres-coder:
        condition: service_healthy
    environment:
      CODER_PG_CONNECTION_URL: postgres://coder:coder@postgres-coder:5432/coder?sslmode=disable
      CODER_HTTP_ADDRESS: 0.0.0.0:7080
      # Workspace containers (running on host docker daemon) reach Coder via host.docker.internal
      CODER_ACCESS_URL: ${CODER_ACCESS_URL:-http://host.docker.internal:7080}
      CODER_WILDCARD_ACCESS_URL: ""
      # First user env vars are referenced by scripts/bootstrap-coder.sh (task #4)
      CODER_FIRST_USER_EMAIL: ${CODER_FIRST_USER_EMAIL:-admin@local.dev}
      CODER_FIRST_USER_USERNAME: ${CODER_FIRST_USER_USERNAME:-admin}
      CODER_FIRST_USER_PASSWORD: ${CODER_FIRST_USER_PASSWORD:-Sup3rSecret!}
      CODER_TELEMETRY_ENABLE: "false"
      # Allow scripts/bootstrap-coder.sh to mint a long-lived (1y) admin API token.
      # Default admin-token cap is 168h (7d); we extend it for the POC onboarding workflow.
      CODER_MAX_TOKEN_LIFETIME: "8760h"
      CODER_MAX_ADMIN_TOKEN_LIFETIME: "8760h"
      # Allow share=authenticated on path-based coder_apps (code-server / terminal).
      # Without this, only the workspace owner can open path-based apps — which
      # blocks anyone (including the onboarding-app session user) from reaching
      # VS Code via /@user/ws/apps/code-server.
      CODER_DANGEROUS_ALLOW_PATH_APP_SHARING: "true"
      CODER_DANGEROUS_ALLOW_PATH_APP_SITE_OWNER_ACCESS: "true"
    ports:
      - "${CODER_HTTP_PORT:-7080}:7080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - coder-data:/home/coder/.config
    networks:
      - control
      - mercato-proxy
    # Coder is published at coder.sandbox.lvh.me via Caddy (long-lived
    # WebSockets work because caddy-docker-proxy passes through Upgrade
    # headers natively). Direct localhost:7080 still works as a fallback.
    labels:
      caddy_0: http://coder.${SANDBOX_DOMAIN:-lvh.me}:80
      caddy_0.reverse_proxy: "{{upstreams 7080}}"
      # caddy-docker-proxy passes WebSocket upgrades through automatically.
      # Disable response buffering so long-lived streams (terminal output,
      # agent stats) flush in real time.
      caddy_0.reverse_proxy.flush_interval: "-1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30

  onboarding:
    build:
      context: ./apps/onboarding
      args:
        CODER_PUBLIC_URL: ${CODER_PUBLIC_URL:-http://localhost:7080}
    container_name: onboarding
    restart: unless-stopped
    depends_on:
      postgres-onboarding:
        condition: service_healthy
      coder:
        condition: service_healthy
    environment:
      NODE_ENV: production
      POSTGRES_URL: postgres://${ONBOARDING_DB_USER:-onboarding}:${ONBOARDING_DB_PASSWORD:-onboarding}@postgres-onboarding:5432/${ONBOARDING_DB_NAME:-onboarding}
      JWT_SECRET: ${JWT_SECRET}
      CODER_URL: http://coder:7080
      CODER_PUBLIC_URL: ${CODER_PUBLIC_URL:-http://localhost:7080}
      CODER_ADMIN_TOKEN_FILE: /run/secrets/coder-admin-token
      CODER_TEMPLATE_ID_FILE: /run/secrets/coder-template-id
      # Cookie scoped to the wildcard root so sessions are coherent across
      # the onboarding host AND every <sandbox>.<SANDBOX_DOMAIN> subdomain.
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-.${SANDBOX_DOMAIN:-lvh.me}}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "${ONBOARDING_HTTP_PORT:-3000}:3000"
    volumes:
      - ./.runtime:/run/secrets:ro
    networks:
      - control
      - mercato-proxy
    labels:
      # Explicit http://...:80 site addr disables Caddy's auto-HTTPS redirect.
      # For prod set CADDY_SCHEME=https in .env; the workspace template uses the
      # same trick. Cookie domain (.sandbox.lvh.me) covers both this host AND
      # every <name>.sandbox.lvh.me workspace subdomain → coherent sessions.
      caddy_0: http://${SANDBOX_DOMAIN:-lvh.me}:80, http://app.${SANDBOX_DOMAIN:-lvh.me}:80
      caddy_0.reverse_proxy: "{{upstreams 3000}}"

  # caddy-docker-proxy: dynamic reverse proxy that reads docker labels.
  # Each workspace container (spawned by the Coder template) is attached to the
  # `mercato-proxy` network and carries `caddy_0` / `caddy_1` labels — caddy
  # picks them up automatically and publishes <workspace>.<SANDBOX_DOMAIN> on
  # standard 80/443. ACME (LetsEncrypt) kicks in only when CADDY_ACME_EMAIL is
  # set AND the domain isn't lvh.me/localhost (caddy auto-detects that).
  caddy:
    image: lucaslorentz/caddy-docker-proxy:2.10-alpine
    container_name: mercato-caddy
    restart: unless-stopped
    environment:
      # Tell caddy-docker-proxy to ignore unrelated containers — it only watches
      # objects on the mercato-proxy network.
      CADDY_INGRESS_NETWORKS: mercato-proxy
      # ACME email (optional). Leave blank for local lvh.me / http-only setups.
      CADDY_DOCKER_DEFAULT_EMAIL: ${CADDY_ACME_EMAIL:-}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - mercato-proxy
