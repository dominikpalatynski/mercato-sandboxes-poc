apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-coder-data
  namespace: mercato-sandboxes
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-coder
  namespace: mercato-sandboxes
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres-coder
  template:
    metadata:
      labels:
        app: postgres-coder
    spec:
      containers:
        - name: postgres
          image: postgres:17
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: coder
            - name: POSTGRES_PASSWORD
              value: coder
            - name: POSTGRES_DB
              value: coder
          ports:
            - containerPort: 5432
              name: postgres
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U coder -d coder
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U coder -d coder
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-coder-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-coder
  namespace: mercato-sandboxes
spec:
  selector:
    app: postgres-coder
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
