apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sandbox-edge
  namespace: mercato-sandboxes
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Sec-WebSocket-Extensions "";
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - sandbox.lvh.me
        - coder.sandbox.lvh.me
        - "*.apps.sandbox.lvh.me"
      secretName: sandbox-lvh-me-tls
  rules:
    - host: sandbox.lvh.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: onboarding
                port:
                  number: 3000
    - host: coder.sandbox.lvh.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: coder
                port:
                  number: 80
    - host: "*.apps.sandbox.lvh.me"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: coder
                port:
                  number: 80
