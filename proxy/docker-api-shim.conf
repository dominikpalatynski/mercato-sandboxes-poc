# Docker daemon API path shim (TCP :2375 → unix:/var/run/docker.sock).
#
# WHY this exists:
# Docker Desktop 4.57+ ships engine 29.x with MinAPIVersion 1.44, which
# hard-rejects requests below that version. Traefik's go-docker client
# hardcodes its initial negotiation call as `GET /v1.24/version` and gives up
# when it gets back 400 — there is no escape hatch in the Traefik docker
# provider for setting a different starting API version.
#
# This nginx rewrites every `/v1.NN/...` path to `/v1.45/...` before
# proxying to the docker daemon socket. v1.45 is supported by Docker engine
# 25–29+ inclusive, so this works across the range we care about.
#
# Security: only the GET endpoints Traefik needs (events, containers,
# networks, services, info, ping, version) are reachable via the socket.
# This is roughly the same surface tecnativa/docker-socket-proxy exposes —
# we just couldn't use that one because it doesn't do path translation.

upstream docker_daemon {
    server unix:/var/run/docker.sock;
}

server {
    listen 2375;

    # Rewrite /v1.NN/<rest> → /v1.45/<rest>. Catch-all so older clients work.
    location ~* ^/v[0-9.]+/(.*)$ {
        rewrite ^/v[0-9.]+/(.*)$ /v1.45/$1 break;
        proxy_pass http://docker_daemon;
        proxy_http_version 1.1;
        # Long polling for /events.
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Docker API expects a Host header; daemon is permissive about value.
        proxy_set_header Host docker;
    }

    # Versionless /info, /version, /events, /_ping → forward as-is.
    location / {
        proxy_pass http://docker_daemon;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host docker;
    }
}
