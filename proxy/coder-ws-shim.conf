# Coder WebSocket-stripping shim.
#
# WHY: Traefik's `customRequestHeaders.Sec-WebSocket-Extensions=""` does NOT
# reliably remove the header on WebSocket upgrade requests (it's treated as
# hop-by-hop and the strip is skipped). Coder then negotiates permessage-
# deflate, sends RSV1-flagged frames, and the browser closes the PTY socket
# within ~10ms — the "trying to connect…" terminal loop and the blank
# code-server screen both come from this.
#
# nginx's `proxy_set_header X "";` provably removes the header. Traefik
# routes `coder.<DOMAIN>` to this shim on :81; the shim forwards to coder:80
# with Accept-Encoding + Sec-WebSocket-Extensions both blanked.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream coder_upstream {
    server coder:80;
    keepalive 32;
}

server {
    listen 81;
    server_name _;

    # Long-lived WS streams (PTY, metadata watch, path-app proxy).
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    client_max_body_size 0;

    location / {
        proxy_pass http://coder_upstream;
        proxy_http_version 1.1;

        # WebSocket upgrade plumbing.
        proxy_set_header Host              $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # The whole point of this shim — strip both directions so
        # permessage-deflate is never negotiated end-to-end.
        proxy_set_header Accept-Encoding         "";
        proxy_set_header Sec-WebSocket-Extensions "";
        proxy_hide_header Sec-WebSocket-Extensions;
    }
}
