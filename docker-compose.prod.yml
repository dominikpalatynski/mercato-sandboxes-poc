# Production override for the Mercato Sandboxes stack.
#
# Activate with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# The base compose file now uses the same shape locally and in production:
# one nginx edge on :80/:443, Coder behind it on the Docker network, and
# Coder's native wildcard app proxy for workspace ports. In production, put
# a real wildcard certificate/key in .runtime/tls/sandbox-lvh-me.{crt,key}
# before starting the stack. The certificate must cover:
#   - ${SANDBOX_DOMAIN}
#   - *.${SANDBOX_DOMAIN}
#   - *.apps.${SANDBOX_DOMAIN}
#
# DATA-PRESERVATION CONTRACT
# --------------------------
# Persistent datasets are named volumes declared in docker-compose.yml:
#   * postgres-coder-data
#   * postgres-onboarding-data
#   * coder-data
# scripts/deploy-hetzner.sh must never call `docker compose down -v`,
# `docker volume rm`, or `docker system prune --volumes`.

name: mercato-sandboxes

services:
  coder:
    image: ghcr.io/coder/coder:${CODER_IMAGE_TAG:-v2.32.0}
    restart: always
    environment:
      CODER_ACCESS_URL: ${CODER_ACCESS_URL:?CODER_ACCESS_URL required in prod}
      CODER_WILDCARD_ACCESS_URL: ${CODER_WILDCARD_ACCESS_URL:?CODER_WILDCARD_ACCESS_URL required in prod}
      CODER_TELEMETRY_ENABLE: "false"

  edge:
    restart: always
    environment:
      SANDBOX_DOMAIN: ${SANDBOX_DOMAIN:?SANDBOX_DOMAIN required in prod}
      WILDCARD_APPS_DOMAIN: ${WILDCARD_APPS_DOMAIN:?WILDCARD_APPS_DOMAIN required in prod}
      PROXY_SCHEME: https

  onboarding:
    restart: always
    environment:
      NODE_ENV: production
      CODER_PUBLIC_URL: ${CODER_PUBLIC_URL:?CODER_PUBLIC_URL required in prod}
      COOKIE_SECURE: "true"
    # No extra public onboarding port in production; the nginx edge publishes
    # https://${SANDBOX_DOMAIN}.
    ports: !reset []

  postgres-onboarding:
    # In prod the onboarding DB is not exposed on the host.
    ports: !reset []
    restart: always

  postgres-coder:
    restart: always
